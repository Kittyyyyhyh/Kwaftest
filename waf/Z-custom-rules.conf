# WAF 靶场 - ModSecurity 审计日志配置 + 路径白名单
# 配合 OWASP CRS Paranoia Level 4 使用

# ---- 审计日志 ----
SecAuditEngine On
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogParts ABCEFHZ
SecAuditLogType Serial

# ---- 默认动作 ----
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

# ---- 白名单: /error/ 路径是自定义错误页 + API/export，关闭规则引擎 ----
SecRule REQUEST_URI "@beginsWith /error/" \
    "id:999100,\
    phase:1,\
    nolog,\
    pass,\
    ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /api/export" \
    "id:999101,\
    phase:1,\
    nolog,\
    pass,\
    ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /api/attack" \
    "id:999102,\
    phase:1,\
    nolog,\
    pass,\
    ctl:ruleEngine=Off"
