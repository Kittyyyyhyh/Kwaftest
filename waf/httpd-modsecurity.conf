LoadModule security2_module /usr/local/apache2/modules/mod_security2.so

Timeout ${TIMEOUT}
LogLevel ${LOGLEVEL}
ErrorLog ${ERRORLOG}

# https://github.com/owasp-modsecurity/ModSecurity/wiki/Reference-Manual-(v2.x)#secserversignature
SecServerSignature ${MODSEC_SERVER_SIGNATURE}

<IfModule reqtimeout_module>
  RequestReadTimeout header=${REQUEST_READ_TIMEOUT_HEADER},MinRate=${REQUEST_READ_TIMEOUT_HEADER_MIN_RATE} body=${REQUEST_READ_TIMEOUT_BODY},MinRate=${REQUEST_READ_TIMEOUT_BODY_MIN_RATE}
</IfModule>

# The "common" and "combined" formats are predefined
LogFormat ${APACHE_LOGFORMAT} modsec
LogFormat ${APACHE_METRICS_LOGFORMAT} metricslog
ErrorLogFormat ${APACHE_ERRORLOG_FORMAT}

CustomLog ${METRICSLOG} metricslog "env=!nologging"

Include /etc/modsecurity.d/setup.conf

# ============================================================
# WAF 响应头注入 — 将 ModSecurity 拦截信息暴露为 HTTP 响应头
# 环境变量由 REQUEST-945-CUSTOM-HEADERS.conf 在 phase:2 设置
# ============================================================

# 始终显示: WAF 引擎版本
Header always set X-WAF-Engine "OWASP-CRS-PL4"

# 仅拦截时 (WAF_BLOCKED=1): 拦截标志 + 各维度异常评分
Header always set X-WAF-Blocked "1" "expr=reqenv('WAF_BLOCKED') == '1'"
Header always set X-WAF-Score-Total "%{WAF_SCORE_TOTAL}e" "expr=reqenv('WAF_BLOCKED') == '1'"
Header always set X-WAF-Score-SQLi "%{WAF_SCORE_SQLI}e" "expr=reqenv('WAF_BLOCKED') == '1'"
Header always set X-WAF-Score-XSS "%{WAF_SCORE_XSS}e" "expr=reqenv('WAF_BLOCKED') == '1'"
Header always set X-WAF-Score-RCE "%{WAF_SCORE_RCE}e" "expr=reqenv('WAF_BLOCKED') == '1'"
Header always set X-WAF-Score-LFI "%{WAF_SCORE_LFI}e" "expr=reqenv('WAF_BLOCKED') == '1'"

# 放行时: WAF 在线但未拦截
Header always set X-WAF-Active "1" "expr=reqenv('WAF_PASSED') == '1'"

# ============================================================
# 手测页面回显方案:
# 1. 拦截时 → ErrorDocument 内转到 app 容器的 PHP 页面
#    /error/403.php 通过共享卷读取 audit.log，动态展示触发规则
# 2. 通过时 → WAF 状态栏在靶场页面底部 (waf-status.php)
# ============================================================

ErrorDocument 403 /error/403.php

# ============================================================
# 转发 WAF 状态到后端 — PHP 靶场页面可通过 $_SERVER 读取
# ============================================================
RequestHeader set X-WAF-Engine "OWASP-CRS-PL4"
RequestHeader set X-WAF-Active "1"
