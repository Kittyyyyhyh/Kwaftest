# WAF 靶场 - 自定义响应头注入规则
# 文件名 REQUEST-945-* 确保在 CRS 评分规则后、949 拦截前执行
#
# 关键发现:
#   tx.blocking_paranoia_level 默认 = 1（只有 PL1 规则参与拦截）
#   tx.detection_paranoia_level = PARANOIA env (4)，只影响检测/日志
#   → 必须像 949110 一样按 BLOCKING_PARANOIA_LEVEL 条件汇总
#   → 直接累加所有 PL 会造成正常请求误判为拦截（如 932350@PL3）

# ---- Step 1: 初始化计数器 ----
SecAction \
    "id:999000,\
    phase:2,\
    nolog,\
    pass,\
    setvar:tx.my_blocking_total=0"

# ---- Step 2: 累加各 PL 分数 + 汇总分类评分 ----
# 与 949060-949063 完全相同的条件逻辑

SecRule TX:BLOCKING_PARANOIA_LEVEL "@ge 1" \
    "id:999001,\
    phase:2,\
    nolog,\
    pass,\
    setvar:tx.my_blocking_total=+%{tx.inbound_anomaly_score_pl1}"

SecRule TX:BLOCKING_PARANOIA_LEVEL "@ge 2" \
    "id:999002,\
    phase:2,\
    nolog,\
    pass,\
    setvar:tx.my_blocking_total=+%{tx.inbound_anomaly_score_pl2}"

SecRule TX:BLOCKING_PARANOIA_LEVEL "@ge 3" \
    "id:999003,\
    phase:2,\
    nolog,\
    pass,\
    setvar:tx.my_blocking_total=+%{tx.inbound_anomaly_score_pl3}"

SecRule TX:BLOCKING_PARANOIA_LEVEL "@ge 4" \
    "id:999004,\
    phase:2,\
    nolog,\
    pass,\
    setvar:tx.my_blocking_total=+%{tx.inbound_anomaly_score_pl4}"

# 汇总分类评分（用于 Total 显示）
SecAction \
    "id:999005,\
    phase:2,\
    nolog,\
    pass,\
    setvar:tx.my_score_total=0"

SecRule TX:SQL_INJECTION_SCORE ".*" \
    "id:999006,\
    phase:2,\
    nolog,\
    pass,\
    setvar:tx.my_score_total=+%{tx.sql_injection_score}"

SecRule TX:XSS_SCORE ".*" \
    "id:999007,\
    phase:2,\
    nolog,\
    pass,\
    setvar:tx.my_score_total=+%{tx.xss_score}"

SecRule TX:RCE_SCORE ".*" \
    "id:999008,\
    phase:2,\
    nolog,\
    pass,\
    setvar:tx.my_score_total=+%{tx.rce_score}"

SecRule TX:LFI_SCORE ".*" \
    "id:999009,\
    phase:2,\
    nolog,\
    pass,\
    setvar:tx.my_score_total=+%{tx.lfi_score}"

# ---- Step 3: 根据汇总分数设置 Apache 环境变量 ----
# 阈值 = ANOMALY_INBOUND (docker-compose 中设为 5)

# 拦截: 汇总分数 ≥ 5 → 设置响应头 env（+ 写共享文件供 PHP 瞬时读取）
# 注: exec 在此镜像中不可用，改用 setenv + Apache 原生机制配合
SecRule TX:MY_BLOCKING_TOTAL "@ge 5" \
    "id:999020,\
    phase:2,\
    nolog,\
    pass,\
    msg:'WAF Blocking - injecting response headers',\
    setenv:WAF_BLOCKED=1,\
    setenv:WAF_SCORE_TOTAL=%{tx.my_score_total},\
    setenv:WAF_SCORE_SQLI=%{tx.sql_injection_score},\
    setenv:WAF_SCORE_XSS=%{tx.xss_score},\
    setenv:WAF_SCORE_RCE=%{tx.rce_score},\
    setenv:WAF_SCORE_LFI=%{tx.lfi_score}"

# 放行: 汇总分数 < 5
SecRule TX:MY_BLOCKING_TOTAL "@lt 5" \
    "id:999021,\
    phase:2,\
    nolog,\
    pass,\
    setenv:WAF_PASSED=1"
